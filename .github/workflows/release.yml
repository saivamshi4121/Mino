name: Windows release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npx vitest run
      - run: npm run dist
      - uses: actions/upload-artifact@v4
        with:
          name: dynamic-island-windows-${{ github.ref_name }}
          path: |
            dist/*.exe
            dist/*.zip
          if-no-files-found: error
